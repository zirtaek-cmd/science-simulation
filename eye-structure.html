<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>눈의 구조 – 부위별 라벨/설명</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
/* ============================================================
   공용 템플릿 (SHARED TEMPLATE) — cell_size_simulation.html 기준
   ============================================================ */
:root{
  --bg: #EFECE4;
  --paper: #FBFAF6;
  --ink: #21262B;
  --ink-soft: #62696F;
  --line: #D9D3C4;
  --core: #F4EEDD;
  --accent: #2F8F94;
  --accent-dark: #1F6669;
  --warn: #B5523B;
  --gold: #C2932B;
  --mono: 'JetBrains Mono', 'Pretendard', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Pretendard', -apple-system, sans-serif;
  padding:28px 16px 60px;
  line-height:1.5;
}
.wrap{max-width:1160px;margin:0 auto;}
header{margin-bottom:22px;}
.eyebrow{
  font-family:var(--mono);
  font-size:12px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--accent-dark);
  margin:0 0 6px;
}
h1{font-size:26px;margin:0 0 8px;font-weight:800;letter-spacing:-0.01em;}
.lead{color:var(--ink-soft);font-size:14.5px;max-width:720px;margin:0;}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 20px;}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;position:relative;}
.buttons{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
button{
  font-family:'Pretendard',sans-serif;
  font-weight:700;
  font-size:13.5px;
  border-radius:9px;
  border:1px solid var(--ink);
  background:var(--ink);
  color:var(--paper);
  padding:10px 18px;
  cursor:pointer;
  transition:opacity .15s;
}
button.secondary{background:transparent;color:var(--ink);}
button:hover{opacity:.82;}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.explain{
  font-size:13.5px;
  color:var(--ink-soft);
  background:var(--core);
  border:1px solid var(--line);
  border-radius:12px;
  padding:14px 16px;
}
.explain b{color:var(--ink);}
footer{margin-top:30px;font-size:11.5px;color:var(--ink-soft);text-align:center;}

/* ---------- 이 페이지 전용 ---------- */
.viewer-layout{display:grid;grid-template-columns:1.6fr 1fr;gap:20px;margin-top:20px;align-items:start;}
.viewer-card{overflow:hidden;}
#canvas-wrap{
  position:relative;
  width:100%;
  height:66vh;
  min-height:520px;
  background:var(--paper);
}
#canvas-wrap canvas{display:block;width:100%;height:100%;touch-action:none;}
.sim-loading{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  color:var(--ink-soft);font-family:var(--mono);font-size:12.5px;
  background:var(--paper);z-index:2;
}
.label-panel{display:flex;flex-direction:column;gap:14px;}
.part-grid{display:flex;flex-wrap:wrap;gap:6px;}
.part-chip{
  padding:7px 12px;
  font-size:12.5px;
  font-weight:600;
  background:var(--paper);
  color:var(--ink-soft);
  border:1px solid var(--line);
}
.part-chip.active{background:var(--gold);color:var(--ink);border-color:var(--gold);}
.desc-name{font-family:var(--mono);font-size:12px;color:var(--accent-dark);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;}
.desc-body{font-size:13.5px;}
.hint-note{margin-top:12px;font-size:12.5px;color:var(--ink-soft);font-family:var(--mono);}
@media (max-width:900px){
  .viewer-layout{grid-template-columns:1fr;}
  #canvas-wrap{height:52vh;min-height:400px;}
}
</style>
</head>
<body>

<div class="wrap">

  <header>
    <p class="eyebrow">Eye Anatomy · Part Labels</p>
    <h1>눈의 구조 — 부위별 이름과 기능</h1>
    <p class="lead">
      아래 목록에서 부위 이름을 눌러보세요. 3D 모델에서 해당 부위가 강조되고,
      오른쪽에 이름과 기능 설명이 나타납니다.
    </p>
  </header>

  <section class="panel controls">
    <div class="buttons">
      <button id="btn-autorotate">자동 회전</button>
      <button id="btn-reset" class="secondary">⟲ 시점 초기화</button>
      <button id="btn-clear" class="secondary">전체 보기</button>
    </div>
  </section>

  <section class="viewer-layout">
    <div class="card viewer-card">
      <div id="canvas-wrap">
        <div class="sim-loading" id="loading">불러오는 중…</div>
      </div>
    </div>

    <div class="panel label-panel">
      <div class="part-grid" id="part-grid"></div>
      <div class="explain" id="desc-box">
        <div class="desc-name">부위를 선택하세요</div>
        <div class="desc-body">목록에서 부위 이름을 누르면 이곳에 설명이 표시됩니다.</div>
      </div>
    </div>
  </section>

  <p class="hint-note">드래그 : 회전 · 스크롤 / 핀치 : 확대·축소</p>

  <footer>눈 구조 3D 시뮬레이션 · 2부 — 부위별 라벨/설명</footer>

</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ------------------------------------------------------------
   눈 구조 부위별 라벨/설명 (2부)
   - 1부와 동일한 3D 모델을 재사용하고, 각 메시를 이름으로 등록해
     클릭 시 강조 + 설명 패널을 연동한다.
   - 설명 텍스트 출처: 사용자가 제공한 중3 과학 교과서/지도서
     (Ⅳ. 자극과 반응 - 1. 감각 기관) PDF
   ------------------------------------------------------------ */

// ---------- 부위 설명 (교과서 텍스트 기반) ----------
const PARTS_INFO = [
  { key: 'sclera', name: '공막', desc: '눈의 가장 바깥쪽을 싸고 있는 흰색 섬유질 막이다. 눈의 형태를 일정하게 유지하고 눈의 내부를 보호하는 역할을 한다.' },
  { key: 'cornea', name: '각막', desc: '공막의 일부가 변한 것으로, 눈의 가장 앞쪽에 있어 빛이 통과하며, 얇고 투명한 콜라젠 섬유로 이루어져 있다.' },
  { key: 'choroid', name: '맥락막', desc: '공막 안쪽에 있으며, 멜라닌 색소가 많아 검은색을 띤다. 동공 이외에 눈 안으로 들어오는 빛을 차단하는 역할을 한다.' },
  { key: 'iris', name: '홍채', desc: '맥락막이 눈 앞쪽에서 도넛 모양으로 변한 것으로, 수정체의 앞부분에 있어 동공의 크기를 변화시켜 눈 안으로 들어오는 빛의 양을 조절한다.' },
  { key: 'pupil', name: '동공', desc: '홍채 가운데 뚫린 구멍으로, 홍채에 의해 가려지지 않아 빛이 눈 안쪽으로 들어가는 통로이다.' },
  { key: 'lens', name: '수정체', desc: '탄력이 있는 두꺼운 볼록 렌즈 모양이며, 빛을 굴절시킨다. 섬모체의 수축과 이완으로 두께가 조절되어 망막에 또렷한 상이 맺히게 한다.' },
  { key: 'vitreous', name: '유리체', desc: '눈 속을 채우고 있는 투명한 유동성 액체로, 이 액체의 압력으로 눈의 형태가 유지된다.' },
  { key: 'retina', name: '망막', desc: '맥락막 안쪽에 있으며, 물체의 상이 맺히는 곳이다. 빛을 자극으로 받아들이는 시각 세포(막대 세포, 원뿔 세포)가 분포해 있다.' },
  { key: 'macula', name: '황반', desc: '망막에서 시각 세포(원뿔 세포)가 가장 많이 분포한 부분으로, 이곳에 물체의 상이 맺히면 물체가 가장 선명하게 보인다.' },
  { key: 'opticNerve', name: '시각 신경', desc: '시각 세포가 받아들인 빛 자극을 뇌(대뇌)로 전달하는 신경이다.' },
];

const canvasWrap = document.getElementById('canvas-wrap');
const loadingEl = document.getElementById('loading');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xFBFAF6);

const camera = new THREE.PerspectiveCamera(
  36,
  canvasWrap.clientWidth / canvasWrap.clientHeight,
  0.1,
  100
);
const INITIAL_CAM_POS = new THREE.Vector3(2.0, 1.0, 3.4);
camera.position.copy(INITIAL_CAM_POS);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(canvasWrap.clientWidth, canvasWrap.clientHeight);
canvasWrap.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.0;
controls.maxDistance = 8;
controls.target.set(0, 0, 0);
controls.autoRotateSpeed = 1.4;
controls.update();

scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const keyLight = new THREE.DirectionalLight(0xffffff, 1.0);
keyLight.position.set(3, 4, 5);
scene.add(keyLight);
const fillLight = new THREE.DirectionalLight(0xffffff, 0.4);
fillLight.position.set(-4, -1, -3);
scene.add(fillLight);
const rimLight = new THREE.DirectionalLight(0xffffff, 0.3);
rimLight.position.set(0, -3, -4);
scene.add(rimLight);

const COLORS = {
  sclera: 0xf3efe2,
  cornea: 0xdcedf5,
  choroid: 0x8a4033,
  retina: 0xd9836f,
  iris: 0x8b5a2b,
  pupil: 0x0c0b0a,
  lens: 0xbfe3f2,
  ciliary: 0xc98a7f,
  vitreous: 0xf3ecb0,
  opticNerve: 0xe8d98f,
  macula: 0xe7c34a,
};
const HIGHLIGHT = 0xc2932b;

const FRONT_CAP = 0.55;
const BACK_CAP = 0.26;
const SHELL_THETA_START = FRONT_CAP;
const SHELL_THETA_LEN = Math.PI - FRONT_CAP - BACK_CAP;
const WEDGE_PHI_START = -0.25;
const WEDGE_PHI_LEN = Math.PI * 1.55;

// key -> { mesh, baseOpacity, baseTransparent, isBasic }
const registry = {};

function shellMaterial(color, opts = {}) {
  return new THREE.MeshStandardMaterial({
    color,
    side: THREE.DoubleSide,
    roughness: opts.roughness ?? 0.65,
    metalness: 0,
    transparent: !!opts.opacity,
    opacity: opts.opacity ?? 1,
    depthWrite: opts.opacity ? false : true,
  });
}

function register(key, mesh) {
  registry[key] = {
    mesh,
    baseOpacity: mesh.material.opacity,
    baseTransparent: mesh.material.transparent,
    isBasic: mesh.material.isMeshBasicMaterial,
    baseColor: mesh.material.color.getHex(),
  };
}

function sphericalToVec(radius, theta, phi) {
  return new THREE.Vector3(
    radius * Math.sin(theta) * Math.cos(phi),
    radius * Math.cos(theta),
    radius * Math.sin(theta) * Math.sin(phi)
  );
}

function buildEye() {
  const group = new THREE.Group();

  const sclera = new THREE.Mesh(
    new THREE.SphereGeometry(1.0, 48, 32, WEDGE_PHI_START, WEDGE_PHI_LEN, SHELL_THETA_START, SHELL_THETA_LEN),
    shellMaterial(COLORS.sclera)
  );
  group.add(sclera);
  register('sclera', sclera);

  const choroid = new THREE.Mesh(
    new THREE.SphereGeometry(0.965, 48, 32, WEDGE_PHI_START, WEDGE_PHI_LEN, SHELL_THETA_START, SHELL_THETA_LEN),
    shellMaterial(COLORS.choroid)
  );
  group.add(choroid);
  register('choroid', choroid);

  const retina = new THREE.Mesh(
    new THREE.SphereGeometry(0.93, 48, 32, WEDGE_PHI_START, WEDGE_PHI_LEN, SHELL_THETA_START, SHELL_THETA_LEN),
    shellMaterial(COLORS.retina)
  );
  group.add(retina);
  register('retina', retina);

  const maculaPos = sphericalToVec(0.915, 2.55, Math.PI * 0.5);
  const macula = new THREE.Mesh(
    new THREE.CircleGeometry(0.09, 24),
    new THREE.MeshBasicMaterial({ color: COLORS.macula, side: THREE.DoubleSide })
  );
  macula.position.copy(maculaPos);
  macula.lookAt(0, 0, 0);
  group.add(macula);
  register('macula', macula);

  const CORNEA_R = 0.62;
  const rEdge = Math.sin(FRONT_CAP) * 1.0;
  const thetaC = Math.asin(Math.min(rEdge / CORNEA_R, 1));
  const corneaCenterY = Math.cos(FRONT_CAP) * 1.0 - Math.cos(thetaC) * CORNEA_R;

  const irisOuter = rEdge * 0.97;
  const iris = new THREE.Mesh(
    new THREE.RingGeometry(0.17, irisOuter, 48),
    shellMaterial(COLORS.iris, { roughness: 0.75 })
  );
  iris.rotation.x = -Math.PI / 2;
  iris.position.y = 0.79;
  group.add(iris);
  register('iris', iris);

  const pupil = new THREE.Mesh(
    new THREE.CircleGeometry(0.17, 32),
    new THREE.MeshBasicMaterial({ color: COLORS.pupil, side: THREE.DoubleSide })
  );
  pupil.rotation.x = -Math.PI / 2;
  pupil.position.y = 0.775;
  group.add(pupil);
  register('pupil', pupil);

  const cornea = new THREE.Mesh(
    new THREE.SphereGeometry(CORNEA_R, 40, 24, 0, Math.PI * 2, 0, thetaC * 1.08),
    shellMaterial(COLORS.cornea, { opacity: 0.28, roughness: 0.1 })
  );
  cornea.position.y = corneaCenterY;
  group.add(cornea);
  register('cornea', cornea);

  const lens = new THREE.Mesh(
    new THREE.SphereGeometry(0.3, 32, 24),
    shellMaterial(COLORS.lens, { opacity: 0.6, roughness: 0.2 })
  );
  lens.scale.set(1, 0.6, 1);
  lens.position.y = 0.6;
  group.add(lens);
  register('lens', lens);

  const ciliary = new THREE.Mesh(
    new THREE.TorusGeometry(0.32, 0.08, 14, 40),
    shellMaterial(COLORS.ciliary, { roughness: 0.7 })
  );
  ciliary.rotation.x = Math.PI / 2;
  ciliary.position.y = 0.65;
  group.add(ciliary);
  register('ciliary', ciliary);

  const vitreous = new THREE.Mesh(
    new THREE.SphereGeometry(0.82, 32, 24),
    shellMaterial(COLORS.vitreous, { opacity: 0.08, roughness: 0.1 })
  );
  vitreous.position.y = -0.08;
  group.add(vitreous);
  register('vitreous', vitreous);

  const backEdgeY = -Math.cos(BACK_CAP);
  const nerve = new THREE.Mesh(
    new THREE.CylinderGeometry(0.2, 0.16, 0.55, 24),
    shellMaterial(COLORS.opticNerve, { roughness: 0.7 })
  );
  nerve.position.y = backEdgeY - 0.275;
  group.add(nerve);
  register('opticNerve', nerve);

  return group;
}

const eyeGroup = buildEye();
eyeGroup.rotation.x = Math.PI / 2;
scene.add(eyeGroup);

// ---------- 강조/흐림 처리 ----------
let selectedKey = null;

function applyState() {
  Object.keys(registry).forEach((key) => {
    const entry = registry[key];
    const mat = entry.mesh.material;
    const isSelected = key === selectedKey;
    const noneSelected = selectedKey === null;

    const forceColorHighlight = entry.isBasic || key === 'lens';

    if (noneSelected) {
      mat.transparent = entry.baseTransparent;
      mat.opacity = entry.baseOpacity;
      if (mat.emissive) mat.emissive.setHex(0x000000);
      if (forceColorHighlight) mat.color.setHex(entry.baseColor);
    } else if (isSelected) {
      mat.transparent = false;
      mat.opacity = 1;
      if (mat.emissive) {
        mat.emissive.setHex(HIGHLIGHT);
        mat.emissiveIntensity = 0.55;
      }
      if (forceColorHighlight) mat.color.setHex(HIGHLIGHT);
    } else {
      mat.transparent = true;
      mat.opacity = Math.min(entry.baseOpacity, entry.baseOpacity * 0.22 + 0.03);
      if (mat.emissive) mat.emissive.setHex(0x000000);
      if (forceColorHighlight) mat.color.setHex(entry.baseColor);
    }
    mat.needsUpdate = true;
  });
}

// ---------- 부위 버튼 목록 ----------
const grid = document.getElementById('part-grid');
const descBox = document.getElementById('desc-box');

PARTS_INFO.forEach((part) => {
  const chip = document.createElement('button');
  chip.type = 'button';
  chip.className = 'part-chip';
  chip.textContent = part.name;
  chip.dataset.key = part.key;
  chip.addEventListener('click', () => selectPart(part.key));
  grid.appendChild(chip);
});

function selectPart(key) {
  selectedKey = selectedKey === key ? null : key;
  applyState();
  updateDesc();
  updateChipStates();
}

function updateChipStates() {
  [...grid.children].forEach((chip) => {
    chip.classList.toggle('active', chip.dataset.key === selectedKey);
  });
}

function updateDesc() {
  if (!selectedKey) {
    descBox.innerHTML = '<div class="desc-name">부위를 선택하세요</div><div class="desc-body">목록에서 부위 이름을 누르면 이곳에 설명이 표시됩니다.</div>';
    return;
  }
  const info = PARTS_INFO.find((p) => p.key === selectedKey);
  descBox.innerHTML = `<div class="desc-name">${info.name}</div><div class="desc-body">${info.desc}</div>`;
}

document.getElementById('btn-clear').addEventListener('click', () => {
  selectedKey = null;
  applyState();
  updateDesc();
  updateChipStates();
});

// ---------- 렌더 루프 ----------
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
loadingEl.style.display = 'none';

// ---------- 리사이즈 ----------
function handleResize() {
  const w = canvasWrap.clientWidth;
  const h = canvasWrap.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', handleResize);
new ResizeObserver(handleResize).observe(canvasWrap);

// ---------- 컨트롤 버튼 ----------
const btnAutorotate = document.getElementById('btn-autorotate');
btnAutorotate.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  btnAutorotate.classList.toggle('secondary', !controls.autoRotate);
});

const btnReset = document.getElementById('btn-reset');
btnReset.addEventListener('click', () => {
  controls.autoRotate = false;
  btnAutorotate.classList.add('secondary');
  controls.target.set(0, 0, 0);
  camera.position.copy(INITIAL_CAM_POS);
  controls.update();
});
</script>

</body>
</html>
