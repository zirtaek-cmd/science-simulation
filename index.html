<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3학년 과학 수업자료</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', 'system-ui', 'sans-serif'],
          },
        }
      }
    }
  </script>
</head>
<body class="bg-neutral-50 font-sans min-h-screen antialiased text-neutral-800">

  <div class="max-w-5xl mx-auto px-6 py-12 md:py-16 lg:py-20">

    <!-- 헤더 -->
    <header class="mb-10 md:mb-14">
      <h1 class="text-2xl md:text-[28px] font-bold tracking-tight text-neutral-900">
        3학년 과학 수업자료
      </h1>
    </header>

    <!-- 단원 그리드 -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-10 md:gap-12">

      <!-- ============================================
           4단원 — 자극과 반응
           ============================================ -->
      <section>
        <div class="flex items-center gap-2.5 mb-4">
          <span class="w-2 h-2 rounded-full bg-teal-500 shrink-0"></span>
          <h2 class="text-[13px] font-semibold text-neutral-400 tracking-widest uppercase">
            4단원 · 자극과 반응
          </h2>
        </div>

        <ul class="bg-white rounded-2xl shadow-sm ring-1 ring-neutral-200/60 overflow-hidden
                    divide-y divide-neutral-100">

          <!-- 항목: 복사해서 늘려 쓰세요 -->
          <li>
            <a href="./simulations/eye-structure.html"
               class="flex items-center justify-between gap-4 px-5 py-[18px]
                      hover:bg-neutral-50 active:bg-neutral-100 transition-colors group">
              <span class="text-[15px] font-medium text-neutral-700">눈의 구조</span>
              <svg class="w-4 h-4 text-neutral-300 group-hover:text-neutral-400 shrink-0 transition-colors"
                   fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
              </svg>
            </a>
          </li>

          <li>
            <a href="./simulations/eye-structure-quiz.html"
               class="flex items-center justify-between gap-4 px-5 py-[18px]
                      hover:bg-neutral-50 active:bg-neutral-100 transition-colors group">
              <span class="text-[15px] font-medium text-neutral-700">눈의 구조 퀴즈</span>
              <svg class="w-4 h-4 text-neutral-300 group-hover:text-neutral-400 shrink-0 transition-colors"
                   fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
              </svg>
            </a>
          </li>

          <li>
            <a href="./simulations/eye-accommodation.html"
               class="flex items-center justify-between gap-4 px-5 py-[18px]
                      hover:bg-neutral-50 active:bg-neutral-100 transition-colors group">
              <span class="text-[15px] font-medium text-neutral-700">눈의 조절작용</span>
              <svg class="w-4 h-4 text-neutral-300 group-hover:text-neutral-400 shrink-0 transition-colors"
                   fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
              </svg>
            </a>
          </li>
          <!-- /항목 -->

        </ul>
      </section>

      <!-- ============================================
           5단원 — 생식과 유전
           ============================================ -->
      <section>
        <div class="flex items-center gap-2.5 mb-4">
          <span class="w-2 h-2 rounded-full bg-amber-500 shrink-0"></span>
          <h2 class="text-[13px] font-semibold text-neutral-400 tracking-widest uppercase">
            5단원 · 생식과 유전
          </h2>
        </div>

        <div class="bg-white rounded-2xl shadow-sm ring-1 ring-neutral-200/60 
                    px-5 py-12 flex items-center justify-center">
          <span class="text-sm text-neutral-300 select-none">준비 중</span>
        </div>
      </section>

      <!-- ============================================
           새 단원 추가 시: 위 section 블록을 복사하세요
           ============================================ -->

    </div>
  </div>

</body>
</html>
