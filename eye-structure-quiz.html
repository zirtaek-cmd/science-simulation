<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>눈의 구조 – 설명 맞히기 퀴즈</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
/* ============================================================
   공용 템플릿 (SHARED TEMPLATE) — cell_size_simulation.html 기준
   ============================================================ */
:root{
  --bg: #EFECE4;
  --paper: #FBFAF6;
  --ink: #21262B;
  --ink-soft: #62696F;
  --line: #D9D3C4;
  --core: #F4EEDD;
  --accent: #2F8F94;
  --accent-dark: #1F6669;
  --warn: #B5523B;
  --gold: #C2932B;
  --mono: 'JetBrains Mono', 'Pretendard', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Pretendard', -apple-system, sans-serif;
  padding:28px 16px 60px;
  line-height:1.5;
}
.wrap{max-width:720px;margin:0 auto;}
header{margin-bottom:22px;}
.eyebrow{
  font-family:var(--mono);
  font-size:12px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--accent-dark);
  margin:0 0 6px;
}
h1{font-size:26px;margin:0 0 8px;font-weight:800;letter-spacing:-0.01em;}
.lead{color:var(--ink-soft);font-size:14.5px;max-width:720px;margin:0;}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 20px;}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;position:relative;}
.buttons{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
button{
  font-family:'Pretendard',sans-serif;
  font-weight:700;
  font-size:13.5px;
  border-radius:9px;
  border:1px solid var(--ink);
  background:var(--ink);
  color:var(--paper);
  padding:10px 18px;
  cursor:pointer;
  transition:opacity .15s;
}
button.secondary{background:transparent;color:var(--ink);}
button:hover{opacity:.82;}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
footer{margin-top:30px;font-size:11.5px;color:var(--ink-soft);text-align:center;}

/* ---------- 이 페이지 전용 ---------- */
.progress-panel{margin-top:20px;}
.progress-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px;}
.progress-label{font-size:13.5px;color:var(--ink-soft);}
.progress-label b{color:var(--ink);font-weight:800;}
.progress-bar{flex:1;min-width:160px;height:8px;border-radius:5px;background:var(--line);overflow:hidden;}
.progress-fill{height:100%;background:var(--gold);width:0%;transition:width .3s ease;}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;}
.quiz-chip{
  padding:5px 10px;font-size:12px;font-weight:600;border-radius:999px;
  background:var(--paper);color:var(--ink-soft);border:1px solid var(--line);
  transition:background .2s,color .2s,border-color .2s;
}
.quiz-chip.mastered{background:var(--accent);color:#fff;border-color:var(--accent);}

.quiz-card{margin-top:20px;padding:24px 22px 26px;}
.q-eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-dark);margin:0 0 10px;}
.q-desc{font-size:16px;line-height:1.65;background:var(--core);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:0 0 18px;}
.diagram-wrap{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;}
.diagram-wrap img{display:block;width:100%;max-width:520px;height:auto;margin:0 auto;}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;}
@media (max-width:520px){.options{grid-template-columns:1fr;}}
.option-btn{
  background:var(--paper);color:var(--ink);border:1px solid var(--line);
  font-size:14px;font-weight:700;padding:14px 16px;border-radius:10px;
  cursor:pointer;text-align:left;transition:border-color .15s,background .15s,color .15s;
}
.option-btn:hover:not(:disabled){border-color:var(--accent);}
.option-btn:disabled{cursor:default;}
.option-btn.correct{background:var(--accent);border-color:var(--accent);color:#fff;}
.option-btn.wrong{background:var(--warn);border-color:var(--warn);color:#fff;}

.feedback{margin-top:16px;padding:12px 14px;border-radius:10px;font-size:13.5px;font-weight:700;}
.feedback.ok{background:rgba(47,143,148,0.12);color:var(--accent-dark);}
.feedback.no{background:rgba(181,82,59,0.12);color:var(--warn);}

.quiz-actions{margin-top:18px;}

#done-view{text-align:center;padding:24px 10px 10px;}
.done-emoji{font-size:42px;margin:0 0 8px;}
#done-view h2{margin:0 0 8px;font-size:20px;}
.done-stat{color:var(--ink-soft);font-size:13.5px;margin:0 0 20px;}
</style>
</head>
<body>

<div class="wrap">

  <header>
    <p class="eyebrow">Eye Anatomy · Quiz</p>
    <h1>눈의 구조 — 설명 맞히기 퀴즈</h1>
    <p class="lead">
      설명을 읽고 해당하는 눈의 구조를 선택하세요. 틀린 구조는 다시 출제되며,
      모든 구조를 한 번씩 맞힐 때까지 계속됩니다.
    </p>
  </header>

  <section class="panel progress-panel">

    </div>
    <div class="chip-row" id="chip-row"></div>

  for (let i = a.length - 1; i > 0; i--) {

    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;

};

document.getElementById('progress-total').textContent = PARTS_INFO.length;

let pool = [];          // 아직 못 맞힌 구조의 key 목록 (섞인 순서)
let current = null;     // 현재 문제의 구조 정보
let totalAttempts = 0;
let wrongAttempts = 0;

function startQuiz() {
  pool = shuffle(PARTS_INFO.map((p) => p.key));
  totalAttempts = 0;
  wrongAttempts = 0;
  renderChips();
  el.questionView.style.display = '';
  el.doneView.style.display = 'none';
  nextQuestion();
}

function renderChips() {
  el.chipRow.innerHTML = '';
  PARTS_INFO.forEach((p) => {
    const chip = document.createElement('span');
    chip.className = 'quiz-chip';
    chip.textContent = p.name;
    chip.dataset.key = p.key;
    el.chipRow.appendChild(chip);
  });
  updateProgress();
}

function updateProgress() {
  const masteredCount = PARTS_INFO.length - pool.length;
  el.progressCount.textContent = masteredCount;
  el.progressFill.style.width = `${(masteredCount / PARTS_INFO.length) * 100}%`;
  [...el.chipRow.children].forEach((chip) => {
    chip.classList.toggle('mastered', !pool.includes(chip.dataset.key));
  });
}

function nextQuestion() {
  if (pool.length === 0) {
    showDone();
    return;
  }
  current = PARTS_INFO.find((p) => p.key === pool[0]);
  el.qDesc.textContent = current.desc;
  el.feedback.style.display = 'none';
  el.btnNext.style.display = 'none';
  renderOptions(current.key);
}

function renderOptions(correctKey) {
  const distractors = shuffle(PARTS_INFO.filter((p) => p.key !== correctKey)).slice(0, 3);
  const options = shuffle([PARTS_INFO.find((p) => p.key === correctKey), ...distractors]);

  el.options.innerHTML = '';
  options.forEach((opt) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'option-btn';
    btn.textContent = opt.name;
    btn.dataset.key = opt.key;
    btn.addEventListener('click', () => selectAnswer(opt.key, btn));
    el.options.appendChild(btn);
  });
}

function selectAnswer(chosenKey, btnEl) {
  if (el.feedback.style.display !== 'none') return; // 중복 클릭 방지

  totalAttempts++;
  const isCorrect = chosenKey === current.key;
  [...el.options.children].forEach((b) => (b.disabled = true));

  pool.shift(); // 현재 문제는 일단 목록 맨 앞에서 제거

  if (isCorrect) {
    btnEl.classList.add('correct');
    showFeedback(true, `정답입니다! — ${current.name}`);
  } else {
    wrongAttempts++;
    btnEl.classList.add('wrong');
    [...el.options.children].forEach((b) => {
      if (b.dataset.key === current.key) b.classList.add('correct');
    });
    // 틀린 문제는 남은 목록 중 임의의 위치에 다시 끼워 넣어 재출제
    const insertAt = pool.length === 0 ? 0 : 1 + Math.floor(Math.random() * pool.length);
    pool.splice(insertAt, 0, current.key);
    showFeedback(false, `아쉬워요. 정답은 "${current.name}"입니다.`);
  }

  updateProgress();
  el.btnNext.style.display = '';
  el.btnNext.textContent = pool.length === 0 ? '결과 보기 →' : '다음 문제 →';
}

function showFeedback(correct, text) {
  el.feedback.textContent = text;
  el.feedback.className = `feedback ${correct ? 'ok' : 'no'}`;
  el.feedback.style.display = '';
}

function showDone() {
  el.questionView.style.display = 'none';
  el.doneView.style.display = '';
  const accuracy = totalAttempts > 0
    ? Math.round(((totalAttempts - wrongAttempts) / totalAttempts) * 100)
    : 100;
  el.doneStat.textContent = `총 ${totalAttempts}번 시도 중 ${wrongAttempts}번 틀렸어요. (정확도 ${accuracy}%)`;
}

el.btnNext.addEventListener('click', nextQuestion);
el.btnRestart.addEventListener('click', startQuiz);

startQuiz();
</script>

</body>
</html>
